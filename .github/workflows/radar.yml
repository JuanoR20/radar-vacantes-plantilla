name: Radar de vacantes

on:
  # El schedule de GitHub queda apagado a propósito. Su scheduler no es
  # confiable: puede pasar días disparando 1 de cada 5 veces, a deshoras, en
  # vez de a las horas fijas — y muchas veces eso no aparece ni en su propia
  # página de estado. El paso 6 del README explica cómo disparar esto desde
  # afuera con un cronjob gratis en cron-job.org, que no depende de este
  # `schedule` para nada y sí llega siempre.
  #
  # Si preferís arriesgarte con el scheduler de GitHub en vez de montar el
  # cronjob externo, descomentá el bloque de abajo — son los mismos horarios
  # de siempre, con su repesca incluida:
  #
  # schedule:
  #   - cron: "55 5 * * 1-5"       # 06:55 de Londres — latido de la mañana
  #   - cron: "55 9,16 * * 1-5"    # 10:55 y 17:55 de Londres
  #   - cron: "25 6,10,17 * * 1-5" # repesca ~30 min después de cada corrida
  #   - cron: "55 7 * * 1"         # resumen semanal, lunes
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de ejecución"
        type: choice
        default: normal
        options: [normal, check, prueba, semanal, reset]

permissions:
  contents: write   # para commitear state.json
  issues: write     # para abrir el issue que dispara el correo

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet -r requirements.txt

      - name: Correr el radar
        id: radar
        env:
          # Lo usa la opción notify_when_nothing_new: morning
          RADAR_PRIMERA_DEL_DIA: ${{ github.event.schedule == '55 5 * * 1-5' }}
          # Las corridas de repesca solo hablan si hay novedad, para no
          # duplicar el aviso cuando la corrida principal ya salió.
          RADAR_AVISAR_SIN_NOVEDADES: ${{ github.event.schedule == '25 6,10,17 * * 1-5' && 'never' || '' }}
        run: |
          # A mano manda `inputs.modo`. Por horario, el cron del lunes dispara
          # el resumen semanal y los demás la corrida normal.
          case "${{ inputs.modo || (github.event.schedule == '55 7 * * 1' && 'semanal' || 'normal') }}" in
            check)   python radar.py --check ;;
            prueba)  python radar.py --demo ;;
            semanal) python radar.py --weekly ;;
            reset)   python radar.py --reset ;;
            *)       python radar.py ;;
          esac

      - name: Abrir issue con las novedades
        if: steps.radar.outputs.has_report == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "${{ steps.radar.outputs.title }}" \
            --body-file report.md

      - name: Guardar el estado
        # El estado va commiteado, no en el caché de Actions: el caché expira a
        # los 7 días y perderlo significa recibir el catálogo entero como
        # novedad. De paso, commitear en cada corrida mantiene el repo activo y
        # evita que GitHub desactive los workflows programados a los 60 días.
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain state.json)" ]]; then
            echo "Sin cambios en el estado."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp state.json /tmp/state.nuevo.json

          # Si alguien empujó al repo mientras corríamos (un push desde GitHub
          # Desktop, una edición por la web), el push se rechaza. En vez de
          # fallar, nos reposicionamos sobre lo último del remoto y volvemos a
          # aplicar NUESTRO state.json: es el que acabamos de calcular contra
          # los datos en vivo, así que siempre gana. Sin rebase ni conflictos.
          for intento in 1 2 3; do
            git add state.json
            git commit -q -m "estado: $(date -u +'%Y-%m-%d %H:%M UTC')" || true
            if git push -q; then
              echo "Estado guardado (intento $intento)."
              exit 0
            fi
            echo "Push rechazado, el remoto avanzó. Reintento $intento…"
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/state.nuevo.json state.json
            if [[ -z "$(git status --porcelain state.json)" ]]; then
              echo "El remoto ya tiene este estado."
              exit 0
            fi
          done

          echo "::error::No se pudo guardar el estado después de 3 intentos."
          exit 1
