# ============================================================================
#  This is the only file you need to edit. The code never changes.
#
#  Three things to set up:
#    1. companies  — whose careers pages to watch
#    2. filters    — which roles you care about
#    3. options    — your GitHub username, so the email reaches you
#
#  Everything below ships as a working example: two real companies and a set
#  of filters for strategy and operations roles in the UK. Run it as-is first
#  to see it work, then replace it with your own.
# ============================================================================

companies:

  # ---- HOW TO FILL THIS IN --------------------------------------------------
  #
  # Don't guess these values. Ask the radar:
  #
  #     python3 radar.py --discover https://www.somecompany.com/careers
  #
  # It tells you which platform the company uses, prints the exact lines to
  # paste here, checks that the connection works, and shows two sample job
  # titles.
  #
  # READ THOSE TITLES. If they don't look like they belong to that company,
  # the id is wrong. A wrong id can quietly point at a different company's
  # job board and still look perfectly healthy.
  #
  # If a company uses a platform that can't be read, the command says so and
  # saves you the afternoon. For those, sign up for the job alert on their
  # own careers page instead.
  # --------------------------------------------------------------------------

  - id: monzo                 # internal name; don't change it later
    name: Monzo               # the name you'll see in the email
    platform: greenhouse
    board: monzo
    active: true

  - id: airwallex
    name: Airwallex
    platform: ashby
    board: airwallex
    active: true

  # Some platforms need a few more lines. --discover prints whichever apply:
  #
  # - id: remitly
  #   name: Remitly
  #   platform: workday
  #   tenant: remitly
  #   pod: wd5
  #   site: Remitly_Careers
  #   active: true
  #
  # If a company's job board is real but currently has no openings, add
  # `allow_empty: true` so it doesn't report "0 roles" on every run.


# ============================================================================
#  FILTERS
#
#  Filters decide what goes in the email. They never decide what gets saved,
#  so widening them later won't flood you with months-old jobs.
#
#  An empty list ([]) means "don't filter on this at all".
# ============================================================================

filters:

  # WHERE YOU WANT TO WORK — matched as whole words.
  # Whole words matter: as a substring, "uk" also matches "Ukraine", so a job
  # in Kyiv would look British. Replace these with your own country and cities.
  locations_include:
    - united kingdom
    - uk
    - gb
    - london

  # A WIDER version of the list above, used only to ask big employers to send
  # back just your region instead of their whole global catalogue. It saves a
  # lot of time on companies with thousands of openings.
  #
  # It must be WIDER than the list above, never narrower — it casts the net,
  # and the precise filtering happens afterwards. Leave it empty to skip this.
  locations_source:
    - united kingdom
    - uk
    - gb
    - england
    - scotland
    - wales
    - northern ireland
    - london

  # ROLES YOU WANT — matched from the start of a word.
  # "partnership" finds "Partnerships"; "ops" finds "Operations".
  #
  # Start with a handful and add more as you go. It's much easier to widen a
  # list than to clean up a flood. These examples are strategy and operations
  # roles — replace them with whatever you're actually looking for.
  titles_include:
    - strategy
    - strategic
    - operations
    - ops
    - business development
    - partnership
    - commercial
    - growth
    - expansion
    - chief of staff

  # ROLES YOU DON'T WANT — these win over the list above.
  #
  # This list grows naturally with use. Every time something irrelevant shows
  # up, look at the "matched:" line in the email, and add the guilty word here.
  titles_exclude:
    - junior
    - entry level
    - engineer
    - engineering
    - software
    - developer
    - designer
    - data scientist
    - recruiter
    - talent acquisition
    - customer support
    - customer service

  # Words that mark a job as an internship. This doesn't throw anything away —
  # it just keeps internships in their own section of the email, separate from
  # the full-time roles.
  titles_internship:
    - intern
    - internship
    - graduate
    - apprentice
    - placement
    - working student
    - summer associate

  # If a job is an internship, it only gets through when it also mentions one
  # of these. Useful when you only want a specific kind — MBA internships, for
  # instance. Leave the list empty to accept any internship.
  internships_require:
    - mba


# ============================================================================
#  TEST CASES
#
#  Made-up job titles and the answer you expect. Run this after changing your
#  filters — it takes a second and never touches the internet:
#
#      python3 radar.py --test
#
#  Add a case whenever you spot a filtering mistake, so it can't come back.
# ============================================================================

tests:
  - {title: "Senior Manager, Operations Strategy", location: "UK - London",    expect: true}
  - {title: "Head of Partnerships, EMEA",          location: "London",         expect: true}
  - {title: "Chief of Staff",                      location: "London, UK",     expect: true}
  # the classic trap: as a substring, "uk" also matches "Ukraine"
  - {title: "Strategy Manager",                    location: "Kyiv, Ukraine",  expect: false}
  - {title: "Commercial Director",                 location: "Singapore",      expect: false}
  - {title: "Growth Engineer",                     location: "London",         expect: false}
  - {title: "Junior Operations Associate",         location: "London",         expect: false}
  # internships: only the MBA ones
  - {title: "MBA Summer Internship, Strategy",     location: "London",         expect: true}
  - {title: "Operations Intern",                   location: "London",         expect: false}


# ============================================================================
#  OPTIONS
# ============================================================================

options:
  # YOUR GitHub username, without the @. The radar mentions you in every
  # alert, and GitHub always emails you about mentions — so this works even
  # if your notification settings are off.
  notify: YOUR-GITHUB-USERNAME

  # Send the email even when there's nothing new, so silence is never
  # ambiguous. If nothing arrives, you know something broke.
  #   always   — all three runs a day
  #   morning  — only the first run of the day
  #   never    — only write when there's something to say
  notify_when_nothing_new: morning

  # Rarely worth changing.
  timeout_seconds: 30
  source_time_limit_seconds: 150   # cap per company, so one slow site can't stall the run
  drop_alert_pct: 70               # warn if a source suddenly returns 70% fewer jobs
  max_pages: 300
